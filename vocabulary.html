<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namromah - Từ vựng THPT</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f7fb;
  color: #171827;
}

.container {
  max-width: 560px;
  margin: auto;
  padding: 20px 16px 40px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.header h1 {
  margin: 0;
  font-size: 27px;
}

.header p {
  margin: 5px 0 0;
  color: #777b8e;
}

.back {
  border: 0;
  background: white;
  width: 44px;
  height: 44px;
  border-radius: 14px;
  font-size: 20px;
}

.search {
  width: 100%;
  padding: 15px 17px;
  border: 1px solid #e3e5ee;
  border-radius: 16px;
  font-size: 16px;
  outline: none;
  margin-bottom: 15px;
}

.search:focus {
  border-color: #6c5ce7;
}

.categories {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 18px;
}

.category {
  white-space: nowrap;
  border: 0;
  padding: 10px 14px;
  border-radius: 14px;
  background: white;
  color: #55586a;
  font-size: 14px;
}

.category.active {
  background: #6c5ce7;
  color: white;
}

.count {
  color: #777b8e;
  font-size: 14px;
  margin-bottom: 12px;
}

.word-card {
  background: white;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: 0 3px 15px rgba(0,0,0,.04);
}

.word-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.word {
  font-size: 22px;
  font-weight: 700;
}

.type {
  color: #6c5ce7;
  background: #f0edff;
  padding: 5px 9px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 600;
}

.meaning {
  margin-top: 8px;
  font-size: 16px;
}

.example {
  margin-top: 10px;
  padding: 11px;
  background: #f7f7fb;
  border-radius: 12px;
  color: #55586a;
  font-size: 14px;
}

.family {
  margin-top: 12px;
  font-size: 14px;
  line-height: 1.7;
}

.family strong {
  color: #6c5ce7;
}

.empty {
  text-align: center;
  padding: 40px 10px;
  color: #777b8e;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div>
      <h1>📚 Từ vựng THPT</h1>
      <p>Học từ theo chủ đề</p>
    </div>

    <button class="back" onclick="history.back()">←</button>
  </div>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔍 Tìm từ vựng..."
    oninput="renderWords()"
  >

  <div class="categories" id="categories"></div>

  <div class="count" id="count"></div>

  <div id="wordList"></div>

</div>

<script>

  family: "sustain (v.) · sustainability (n.) · sustainably (adv.)"

},

{

},

/* ================= CULTURE ================= */

{

  type: "n.",

  example: "Every country has its own culture.",
  family: "cultural (adj.) · culturally (adv.)"
},

{

/* ================= TRAVEL ================= */

{

},

{
  word: "destination",

const topics = [
  "All",
  "Education",
  "Environment",
  "Technology",
  "Health",
  "Society",
  "Jobs & Career",
  "Science",
  "Globalization",
  "Media",
  "Culture",
  "Travel"
];

let currentTopic = "All";

function renderCategories() {
  const box = document.getElementById("categories");

  box.innerHTML = topics.map(topic => `
    <button
      class="category ${topic === currentTopic ? "active" : ""}"
      onclick="selectTopic('${topic}')">
      ${topic === "All" ? "📚 Tất cả" : topic}
    </button>
  `).join("");
}

function selectTopic(topic) {
  currentTopic = topic;
  renderCategories();
  renderWords();
}

function renderWords() {

  const keyword =
    document.getElementById("search").value
    .toLowerCase()
    .trim();

  let filtered = words.filter(item => {

    const matchesTopic =
      currentTopic === "All" ||
      item.topic === currentTopic;

    const matchesSearch =
      !keyword ||
      item.word.toLowerCase().includes(keyword) ||
      item.meaning.toLowerCase().includes(keyword);

    return matchesTopic && matchesSearch;
  });

  document.getElementById("count").textContent =
    `${filtered.length} từ vựng`;

  const list = document.getElementById("wordList");

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty">
        Không tìm thấy từ phù hợp.
      </div>
    `;
    return;
  }

  list.innerHTML = filtered.map(item => `
    <div class="word-card">

      <div class="word-top">
        <div class="word">${item.word}</div>
        <div class="type">${item.type}</div>
      </div>

      <div class="meaning">
        ${item.meaning}
      </div>

      <div class="example">
        📝 ${item.example}
      </div>

      <div class="family">
        <strong>Word Family:</strong><br>
        ${item.family}
      </div>

    </div>
  `).join("");
}

renderCategories();
renderWords();

</script>

</html>
